name: CounterApp
options:
  bundleIdPrefix: dev.palai.demo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  CounterApp:
    type: application
    platform: iOS
    sources: [App/Sources]
    info:
      path: App/Sources/Info.plist
      properties:
        CFBundleDisplayName: Counter
        UILaunchScreen: {}
    preBuildScripts:
      - name: SandboxProbe
        script: |
          f="/private/tmp/palai-probe-$$"
          if echo probe > "$f" 2>/dev/null; then echo "SANDBOX-PROBE outside-write=ALLOWED"; rm -f "$f"; else echo "SANDBOX-PROBE outside-write=DENIED"; fi
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
